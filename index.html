<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="메시지">
<link rel="manifest" href="manifest.json">
<title>메시지</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #ffffff;
    --ink: #000000;
    --ink-sub: #8c8c8c;
    --bubble: #f0f0f0;
    --field: #f0f0f0;
    --hairline: #c9c9c9;
    /* One UI 실측 기준 (1080px 캡처 / DPR 2.75 → 393dp) */
    --ab-h: 64px;   /* app bar : 176px ÷ 2.75 */
  }

  html, body {
    height: 100%;
    background: #000;
    overscroll-behavior: none;
  }

  body {
    font-family: "Samsung Sans", "SamsungOne", -apple-system, BlinkMacSystemFont,
                 "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto,
                 "Noto Sans KR", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  /* ---------- phone shell ---------- */
  .phone {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 520px;
    height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---------- app bar ---------- */
  .appbar {
    flex: 0 0 auto;
    height: var(--ab-h);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px 0 8px;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 0;
    background: none;
    color: var(--ink);
    border-radius: 50%;
    flex: 0 0 auto;
  }
  .icon-btn:active { background: rgba(0,0,0,.06); }

  .avatar {
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #e3e3e3;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9a9a;
  }

  .peer {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .peer-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- thread ---------- */
  .thread {
    flex: 1 1 auto;
    min-height: 0;                     /* flex 자식이 실제로 스크롤되려면 필수 */
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch; /* iOS 관성 스크롤 */
    overscroll-behavior: contain;      /* 끝에서 페이지가 딸려 움직이지 않도록 */
    touch-action: pan-y;               /* 세로 스와이프는 스크롤에 양보 */
    padding: 6px 16px 14px;
  }
  /* 실제 메시지 앱처럼 스크롤바는 숨기되 스크롤은 그대로 동작 */
  .thread { scrollbar-width: none; }
  .thread::-webkit-scrollbar { width: 0; height: 0; }

  .spam-notice {
    padding: 8px 8px 0;
    text-align: center;
  }
  .spam-notice p {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-sub);
    letter-spacing: -0.4px;
    margin-bottom: 14px;
    word-break: keep-all;   /* '피/싱'처럼 단어 중간에서 잘리지 않게 */
  }
  .spam-actions {
    display: flex;
    gap: 12px;
    padding: 0 2px;
  }
  .spam-actions button {
    flex: 1 1 0;
    height: 40px;              /* 110px ÷ 2.75 */
    border: 1px solid var(--hairline);
    border-radius: 20px;
    background: #fff;
    color: #1b1b1b;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    font-family: inherit;
  }
  .spam-actions button:active { background: #f2f2f2; }

  .day-sep {
    text-align: center;
    font-size: 13px;
    color: var(--ink-sub);
    letter-spacing: -0.3px;
    margin: 26px 0 16px;
  }

  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 10px;
  }
  .bubble {
    max-width: 74%;
    padding: 11px 15px 12px;
    border-radius: 20px;
    background: var(--bubble);
    font-size: 15.5px;
    line-height: 1.42;
    letter-spacing: -0.3px;
    white-space: pre-wrap;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
  }
  .stamp {
    flex: 0 0 auto;
    font-size: 12.5px;
    color: var(--ink-sub);
    letter-spacing: -0.2px;
    padding-bottom: 3px;
    white-space: nowrap;
  }

  .row.enter .bubble { animation: pop .26s cubic-bezier(.22,1,.36,1); }
  .row.enter .stamp  { animation: fade .3s ease .06s both; }
  @keyframes pop  { from { opacity: 0; transform: translateY(10px) scale(.94); } }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- input bar ---------- */
  .inputbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 10px 8px;
  }
  .field {
    flex: 1 1 auto;
    min-width: 0;
    height: 44px;
    margin: 0 4px;
    border-radius: 22px;
    background: var(--field);
    display: flex;
    align-items: center;
    padding: 0 8px 0 18px;
  }
  .field .spacer { flex: 1 1 auto; }

  .home-indicator {
    flex: 0 0 auto;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-indicator i {
    display: block;
    width: 132px;
    height: 5px;
    border-radius: 3px;
    background: #1c1c1c;
  }

</style>
</head>
<body>

<div class="phone" id="phone">

  <!-- 상태바는 두지 않습니다. 실기기에서는 폰 자체 상태바가 위에 표시되므로
       여기서 또 그리면 시계·배터리가 두 줄로 겹쳐 보입니다. -->

  <!-- ============ app bar ============ -->
  <div class="appbar">
    <button class="icon-btn" aria-label="뒤로">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4.5 7 12l7.5 7.5"/>
      </svg>
    </button>

    <div class="avatar" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="8.4" r="3.9"/>
        <path d="M12 13.6c-4 0-6.6 2.3-6.6 5.2h13.2c0-2.9-2.6-5.2-6.6-5.2Z"/>
      </svg>
    </div>

    <div class="peer">
      <div class="peer-name" id="peerName">+82 10 3232 1976</div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5.5 9 12 15.5 18.5 9"/>
      </svg>
    </div>

    <button class="icon-btn" aria-label="더보기">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>
      </svg>
    </button>
  </div>

  <!-- ============ thread ============ -->
  <div class="thread" id="thread">
    <div class="spam-notice">
      <p>저장되지 않은 번호에서 온 메시지입니다. 스미싱이나 피싱에 유의하세요.</p>
      <div class="spam-actions">
        <button type="button">수신 차단</button>
        <button type="button">메시지 신고</button>
      </div>
    </div>
    <div id="messages"></div>
  </div>

  <!-- ============ input bar ============ -->
  <div class="inputbar">
    <button class="icon-btn" aria-label="갤러리">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <rect x="3" y="4.6" width="18" height="14.8" rx="2.6"/>
        <path d="M3 16.2l4.6-4.3 4 3.6 3.4-3.2L21 17"/>
        <circle cx="8.4" cy="9.2" r="1.5"/>
      </svg>
    </button>
    <button class="icon-btn" aria-label="카메라">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <path d="M3 8.4a2 2 0 0 1 2-2h2.2l1.3-2h6.9l1.3 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9Z"/>
        <circle cx="12" cy="12.6" r="3.5"/>
      </svg>
    </button>
    <button class="icon-btn" aria-label="추가">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>

    <div class="field">
      <div class="spacer"></div>
      <button class="icon-btn" aria-label="스티커">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="8.6"/>
          <circle cx="9.2" cy="10.2" r="1.05" fill="currentColor" stroke="none"/>
          <circle cx="14.8" cy="10.2" r="1.05" fill="currentColor" stroke="none"/>
          <path d="M8.6 14.4c.9 1.2 2 1.8 3.4 1.8s2.5-.6 3.4-1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <button class="icon-btn" aria-label="음성">
      <svg width="25" height="25" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M3 11v2M6.4 8.4v7.2M9.8 5.4v13.2M13.2 8.4v7.2M16.6 10v4M20 7.4v9.2"/>
      </svg>
    </button>
  </div>

  <div class="home-indicator"><i></i></div>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     설정
     ========================================================= */
  const STORAGE_KEY = "gcdp_msg_thread_v1";
  const DOUBLE_TAP_MS = 320;   // 두 번 터치 인정 간격
  const TAP_SLOP_PX   = 12;    // 이 이상 움직이면 스크롤로 간주
  const TAP_MAX_MS    = 260;   // 이 이상 누르면 롱프레스로 간주

  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  const thread = document.getElementById("thread");
  const list   = document.getElementById("messages");

  /* =========================================================
     시간 포맷
     ========================================================= */
  // 메시지: "오전 3:27"
  const fmtStamp = (d) => {
    const h = d.getHours();
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h < 12 ? "오전" : "오후"} ${h12}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  // 구분선: "8월 13일 목요일"
  const fmtDay = (d) =>
    `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;

  const dayKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  /* =========================================================
     경고 메시지 본문 — 펌웨어 sendAlertSms() 포맷
       firmware/src/main.cpp:1072-1084
     ========================================================= */
  const rand = (min, max, digits) =>
    (Math.random() * (max - min) + min).toFixed(digits);

  function buildAlertBody() {
    // 온열질환 위험 구간의 값을 매번 새로 생성
    const bpm  = rand(118, 148, 1);          // 빈맥
    const temp = rand(38.4, 40.2, 2);        // 고체온
    const lat  = rand(13.7350, 13.7385, 6);  // 방콕 인근
    const lon  = rand(100.5210, 100.5250, 6);

    return [
      "[국외발신]",
      "SOS HELP REQUEST",
      `HR: ${bpm} bpm`,
      `TEMP: ${temp} C`,
      `LOC: ${lat},${lon}`
    ].join("\n");
  }

  /* =========================================================
     저장 / 복원
     ========================================================= */
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch {
      return [];
    }
  }

  function save(msgs) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(msgs));
    } catch {
      /* 저장 실패해도 화면 동작은 유지 */
    }
  }

  let messages = load();

  /* =========================================================
     렌더링
     ========================================================= */
  function appendDaySep(date) {
    const el = document.createElement("div");
    el.className = "day-sep";
    el.textContent = fmtDay(date);
    list.appendChild(el);
  }

  function appendBubble(msg, animate) {
    const date = new Date(msg.at);

    const row = document.createElement("div");
    row.className = animate ? "row enter" : "row";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = msg.body;

    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.textContent = fmtStamp(date);

    row.append(bubble, stamp);
    list.appendChild(row);
  }

  function renderAll() {
    list.textContent = "";
    let lastDay = null;
    for (const msg of messages) {
      const date = new Date(msg.at);
      const key = dayKey(date);
      if (key !== lastDay) {
        appendDaySep(date);
        lastDay = key;
      }
      appendBubble(msg, false);
    }
    scrollToBottom(false);
  }

  function scrollToBottom(smooth) {
    // 레이아웃이 확정된 다음 프레임에 이동
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        thread.scrollTo({
          top: thread.scrollHeight,
          behavior: smooth ? "smooth" : "auto"
        });
      });
    });
  }

  /* =========================================================
     메시지 수신
     ========================================================= */
  function receiveAlert() {
    const now = new Date();
    const msg = { at: now.getTime(), body: buildAlertBody() };

    // 날짜가 바뀌었으면 구분선 먼저
    const prev = messages[messages.length - 1];
    if (!prev || dayKey(new Date(prev.at)) !== dayKey(now)) {
      appendDaySep(now);
    }

    messages.push(msg);
    save(messages);

    appendBubble(msg, true);
    scrollToBottom(true);

    if (navigator.vibrate) navigator.vibrate([60, 45, 60]);
  }

  /* =========================================================
     더블탭 감지 — 스크롤/롱프레스와 구분
     ========================================================= */
  let downAt = 0, downX = 0, downY = 0, lastTapAt = 0;

  document.addEventListener("pointerdown", (e) => {
    downAt = e.timeStamp;
    downX = e.clientX;
    downY = e.clientY;
  }, { passive: true });

  document.addEventListener("pointerup", (e) => {
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
    const held  = e.timeStamp - downAt;
    if (moved > TAP_SLOP_PX || held > TAP_MAX_MS) {
      lastTapAt = 0;   // 스크롤/롱프레스 — 탭으로 세지 않음
      return;
    }

    if (e.timeStamp - lastTapAt <= DOUBLE_TAP_MS) {
      lastTapAt = 0;
      receiveAlert();
    } else {
      lastTapAt = e.timeStamp;
    }
  }, { passive: true });

  // 브라우저 기본 더블탭 확대 차단
  document.addEventListener("dblclick", (e) => e.preventDefault());
  document.addEventListener("gesturestart", (e) => e.preventDefault());

  /* =========================================================
     기록 초기화 — 아바타 길게 누르기 (데모 재시작용)
     ========================================================= */
  const avatar = document.querySelector(".avatar");
  let holdTimer = null;

  avatar.addEventListener("pointerdown", () => {
    holdTimer = setTimeout(() => {
      messages = [];
      save(messages);
      renderAll();
      if (navigator.vibrate) navigator.vibrate(30);
    }, 800);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
    avatar.addEventListener(ev, () => clearTimeout(holdTimer))
  );

  /* =========================================================
     시작
     ========================================================= */
  renderAll();
})();
</script>
</body>
</html>
